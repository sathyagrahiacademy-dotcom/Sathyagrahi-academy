<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Login | Sathyagrahi Academy</title>
<link rel="icon" href="assets/favicon.png">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f6fb;font-family:Arial,sans-serif;color:#15213a}
.card{width:min(410px,92vw);background:#fff;border:1px solid #dce4ef;border-radius:14px;padding:30px;box-shadow:0 12px 35px #17345b18}
.brand{text-align:center;margin-bottom:24px}.brand img{width:62px}.brand h1{font-size:22px;color:#06275f;margin:10px 0 4px}.brand p{font-size:13px;line-height:1.5;color:#78859a;margin:0}
label{display:block;font-size:13px;font-weight:700;margin:14px 0 6px}
input{width:100%;padding:12px;border:1px solid #cdd7e5;border-radius:7px;outline:none;font-size:14px}input:focus{border-color:#0b3f91}
.password-wrap{position:relative}.password-wrap input{padding-right:70px}
.toggle-password{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:auto;margin:0;padding:6px 8px;border:0;background:transparent;color:#0b3f91;font-size:11px;font-weight:800;cursor:pointer}
button{width:100%;margin-top:18px;padding:12px;border:0;border-radius:7px;background:#06275f;color:#fff;font-weight:800;font-size:13px;cursor:pointer}button:disabled{opacity:.6;cursor:not-allowed}
.login-tools{display:flex;justify-content:flex-end;margin-top:9px}
.forgot-btn{width:auto;margin:0;padding:0;background:transparent;color:#0b3f91;border:0;font-size:12.5px;font-weight:700;text-decoration:underline;text-underline-offset:2px}
.msg{min-height:20px;margin-top:12px;text-align:center;font-size:12.5px;line-height:1.45}.error{color:#b42318}.success{color:#067647}
.setup{margin-top:22px;padding-top:18px;border-top:1px solid #edf1f6;text-align:center;font-size:12px;line-height:1.5;color:#77849a}
.setup button{background:#fff;color:#06275f;border:1px solid #b9c7da;margin-top:9px;font-size:12px}
</style>
</head>
<body>
<main class="card">
<div class="brand"><img src="assets/favicon.png" alt="Sathyagrahi Academy"><h1>Sathyagrahi Academy</h1><p>Secure Administration Portal</p></div>
<form id="loginForm">
<label for="adminId">Admin ID</label>
<input id="adminId" type="text" inputmode="numeric" maxlength="4" value="1901" autocomplete="username" required>
<label for="password">Password</label>
<div class="password-wrap">
<input id="password" type="password" autocomplete="current-password" required>
<button id="togglePassword" class="toggle-password" type="button">SHOW</button>
</div>
<div class="login-tools"><button id="forgotPasswordBtn" class="forgot-btn" type="button">Forgot Password?</button></div>
<button id="loginBtn" type="submit">ADMIN LOGIN</button>
<div id="msg" class="msg"></div>
</form>
<div class="setup">First-time setup only
<button id="setupBtn" type="button">CREATE ADMIN ACCOUNT</button></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="admin-login.js?v=20260904-1"></script>
</body>
</html>

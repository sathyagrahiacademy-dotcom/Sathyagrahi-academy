<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#082a63">
<title>Reset Student Password | Sathyagrahi Academy</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:grid;place-items:center;
  background:#f3f6fb;font-family:Arial,sans-serif;color:#15213a;padding:20px
}
.card{
  width:min(430px,100%);background:#fff;border:1px solid #dce4ef;
  border-radius:16px;padding:30px;box-shadow:0 12px 35px #17345b18
}
.brand{text-align:center;margin-bottom:24px}
.brand img{width:64px;height:64px;object-fit:contain}
.brand h1{font-size:22px;color:#06275f;margin:10px 0 5px}
.brand p{font-size:13px;line-height:1.55;color:#78859a;margin:0}
label{display:block;font-size:13px;font-weight:700;margin:15px 0 6px}
.password-wrap{position:relative}
input{
  width:100%;padding:12px 70px 12px 12px;border:1px solid #cdd7e5;
  border-radius:8px;outline:none;font-size:14px
}
input:focus{border-color:#0b3f91;box-shadow:0 0 0 3px #0b3f9112}
.toggle{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);
  border:0;background:transparent;color:#0b3f91;font-size:11px;font-weight:800;
  padding:6px 8px;cursor:pointer
}
.primary{
  width:100%;margin-top:20px;padding:12px;border:0;border-radius:8px;
  background:#06275f;color:#fff;font-weight:800;font-size:13px;cursor:pointer
}
.primary:disabled{opacity:.55;cursor:not-allowed}
.back{
  display:block;width:100%;margin-top:10px;padding:11px 12px;border-radius:8px;
  border:1px solid #b9c7da;color:#06275f;text-decoration:none;text-align:center;
  font-size:12px;font-weight:800
}
.msg{min-height:22px;margin-top:13px;text-align:center;font-size:12.5px;line-height:1.5}
.msg.info{color:#52657b}.msg.error{color:#b42318}.msg.success{color:#067647}
.note{
  margin-top:18px;padding:11px 12px;background:#f5f8fc;border:1px solid #e1e8f1;
  border-radius:8px;color:#64748b;font-size:11.5px;line-height:1.5
}
</style>
</head>
<body>
<main class="card">
  <div class="brand">
    <img src="assets/favicon.png" alt="Sathyagrahi Academy">
    <h1>Reset Student Password</h1>
    <p>Create a new password for your Sathyagrahi Academy Student Portal.</p>
  </div>

  <form id="resetForm">
    <label for="newPassword">New Password</label>
    <div class="password-wrap">
      <input id="newPassword" type="password" autocomplete="new-password" minlength="8" required>
      <button class="toggle" id="toggleNew" type="button">SHOW</button>
    </div>

    <label for="confirmPassword">Confirm Password</label>
    <div class="password-wrap">
      <input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required>
      <button class="toggle" id="toggleConfirm" type="button">SHOW</button>
    </div>

    <button class="primary" id="updateBtn" type="submit" disabled>UPDATE PASSWORD</button>
    <div class="msg info" id="resetMessage" role="status" aria-live="polite">Checking password reset link...</div>
  </form>

  <a class="back" href="index.html#student-portal">BACK TO STUDENT LOGIN</a>

  <div class="note">
    For security, the reset link is temporary. If it has expired, return to Student Login, enter your Student ID and request a new link.
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="student-reset-password.js"></script>
</body>
</html>

name: Exam Scope and Month Folders
on:
  push:
    branches:
      - fix/exam-scope-and-month-folders
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test exam-scope-month-folders.test.mjs
      - run: node --check admin-exams-enhancements.js
      - run: node --check admin-examinations-nav.js
      - run: node --check exam-scope-ui-utils.js

name: Examination Branch Shell Test
on:
  push:
    branches:
      - ui/examination-branch-shell
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test examination-branch-shell.test.mjs

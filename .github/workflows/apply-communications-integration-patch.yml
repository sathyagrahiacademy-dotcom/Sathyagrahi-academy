name: Apply Communications Integration Patch

on:
  push:
    branches:
      - feature/academy-communications-hub
    paths:
      - '.github/workflows/apply-communications-integration-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/academy-communications-hub

      - name: Apply exact integration patch
        run: |
          python - <<'PY'
          from pathlib import Path

          edge_path=Path('supabase/functions/admin-exams/index.ts')
          edge=edge_path.read_text()

          helper_anchor="""async function activeStudents(admin: any) {"""
          helper="""async function bestEffortCommunicate(action: string, payload: Record<string, unknown>) {
            const url = Deno.env.get('SUPABASE_URL') || ''
            const key = Deno.env.get('ACADEMY_COMMUNICATIONS_INTERNAL_KEY') || ''
            if (!url || !key) return { ok:false, skipped:true, reason:'Communications internal delivery is not configured' }
            try {
              const response = await fetch(`${url}/functions/v1/academy-communications`, {
                method:'POST',
                headers:{'Content-Type':'application/json','x-sga-internal-key':key},
                body:JSON.stringify({action,...payload})
              })
              const data = await response.json().catch(()=>({}))
              if (!response.ok) return { ok:false, error:String(data?.error||'Communication request failed') }
              return { ok:true, response:data }
            } catch (error) {
              console.error('best-effort communication failed', error instanceof Error ? error.message : String(error))
              return { ok:false, error:error instanceof Error ? error.message : 'Communication request failed' }
            }
          }
          async function activeStudents(admin: any) {"""
          if 'async function bestEffortCommunicate(' not in edge:
              if helper_anchor not in edge: raise SystemExit('helper anchor not found')
              edge=edge.replace(helper_anchor,helper,1)

          old_publish="""      const {error}=await admin.from('exams').update({is_published:true,status:'active',scheduled_start:null,scheduled_end:null}).eq('id',examId)
                if (error) return json({error:error.message},400)
                return json({ok:true})"""
          new_publish="""      const {error}=await admin.from('exams').update({is_published:true,status:'active',scheduled_start:null,scheduled_end:null}).eq('id',examId)
                if (error) return json({error:error.message},400)
                const communication=await bestEffortCommunicate('exam_published',{examId})
                return json({ok:true,communication})"""
          if "bestEffortCommunicate('exam_published'" not in edge:
              if old_publish not in edge: raise SystemExit('exam publish anchor not found')
              edge=edge.replace(old_publish,new_publish,1)

          result_anchor="""    if (action === 'set_audience') {"""
          result_block="""    if (action === 'publish_result') {
              const attemptId=String(body.attemptId||'')
              if (!attemptId) return json({error:'Attempt ID is required'},400)
              const {data:attempt,error:attemptError}=await admin.from('exam_attempts').select('id,exam_id,student_id').eq('id',attemptId).maybeSingle()
              if (attemptError) return json({error:attemptError.message},400)
              if (!attempt) return json({error:'Attempt not found'},404)
              const {data:result,error:resultError}=await admin.from('exam_results').select('attempt_id').eq('attempt_id',attemptId).maybeSingle()
              if (resultError) return json({error:resultError.message},400)
              if (!result) return json({error:'Result not found'},404)
              const resultUpdate=await admin.from('exam_results').update({is_published:true}).eq('attempt_id',attemptId)
              if (resultUpdate.error) return json({error:resultUpdate.error.message},400)
              const examUpdate=await admin.from('exams').update({result_published:true}).eq('id',attempt.exam_id)
              if (examUpdate.error) return json({error:examUpdate.error.message},400)
              const communication=await bestEffortCommunicate('result_published',{attemptId})
              return json({ok:true,communication})
            }
            if (action === 'set_audience') {"""
          if "action === 'publish_result'" not in edge:
              if result_anchor not in edge: raise SystemExit('result publish anchor not found')
              edge=edge.replace(result_anchor,result_block,1)

          edge_path.write_text(edge)

          js_path=Path('admin-results.js')
          js=js_path.read_text()
          old_js="""async function publish(attemptId,examId){if(!confirm('Publish this result to the student?'))return;const {error}=await c.from('exam_results').update({is_published:true}).eq('attempt_id',attemptId);if(error){alert(error.message);return}await c.from('exams').update({result_published:true}).eq('id',examId);await load()}"""
          new_js="""async function publish(attemptId,examId){if(!confirm('Publish this result to the student?'))return;try{await adminCall({action:'publish_result',attemptId});await load()}catch(e){alert(e.message||'Could not publish result.')}}"""
          if "action:'publish_result'" not in js:
              if old_js not in js: raise SystemExit('admin results publish anchor not found')
              js=js.replace(old_js,new_js,1)
          js_path.write_text(js)
          PY

      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo 'Patch already applied.'
            exit 0
          fi
          git config user.name 'sathyagrahiacademy-dotcom'
          git config user.email 'sathyagrahiacademy@gmail.com'
          git add supabase/functions/admin-exams/index.ts admin-results.js
          git commit -m 'feat: connect exam and result communications'
          git push origin HEAD:feature/academy-communications-hub

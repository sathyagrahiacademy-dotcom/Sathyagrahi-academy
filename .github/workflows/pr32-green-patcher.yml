name: PR32 Green Patcher

on:
  push:
    branches:
      - fix/draft-exam-safe-delete

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/draft-exam-safe-delete
          fetch-depth: 0
      - name: Apply bounded draft-delete implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          control = Path('admin-exam-control-center.js')
          s = control.read_text()
          if 'data-delete-draft' not in s:
              start = s.index('  function rowHtml(x){')
              end = s.index('\n  function renderTable(){', start)
              row = '''  function rowHtml(x){
            const issue=(x.issues||[]).length?'<span style="color:#b42318">●</span> ':'';
            const draftDelete=x.state==='draft'?` <button class="small-btn delete-draft" data-id="${esc(x.id)}" data-delete-draft="1">DELETE DRAFT EXAM</button>`:'';
            return `<tr data-control-row="1"><td><strong>${issue}${esc(x.title)}</strong></td><td><span class="type-badge">${esc(typeLabel(x.examType))}</span></td><td>${x.batchNo==null?'—':esc(String(x.batchNo).padStart(2,'0'))}</td><td>${esc(dateLabel(x.examDate))}</td><td><strong>${esc(x.examCode||'—')}</strong></td><td>${x.questionCount}/${x.expectedQuestions??x.questionCount}</td><td>${x.assignedCount}</td><td><span class="exam-status ${esc(x.state)}">${esc(ui.statusLabel(x.state))}</span></td><td class="exam-next" data-id="${esc(x.id)}">${actionButton(x)} <button class="small-btn questions" data-id="${esc(x.id)}">QUESTIONS</button>${draftDelete}</td></tr>`;
          }
          '''
              s = s[:start] + row + s[end:]

              needle = "    rows.addEventListener('click',e=>{const b=e.target.closest('.control-next');if(b){e.preventDefault();e.stopPropagation();route(b.dataset.id,b.dataset.route)}});"
              if needle not in s:
                  raise SystemExit('control click listener anchor not found')
              listener = '''    rows.addEventListener('click',async e=>{
            const del=e.target.closest('[data-delete-draft]');
            if(del){
              e.preventDefault();e.stopPropagation();
              const exam=exams.find(x=>String(x.id)===String(del.dataset.id));
              if(!exam||exam.state!=='draft')return;
              const confirmCode=window.prompt(`DELETE DRAFT EXAM\n\nType the exact Exam Code to confirm:\n${exam.examCode||''}`,'');
              if(confirmCode==null)return;
              del.disabled=true;
              try{await call({action:'delete',examId:exam.id,confirmCode});await loadControlCenter()}
              catch(err){window.alert(err?.message||'Could not delete draft exam')}
              finally{del.disabled=false}
              return;
            }
            const b=e.target.closest('.control-next');if(b){e.preventDefault();e.stopPropagation();route(b.dataset.id,b.dataset.route)}
          });'''
              s = s.replace(needle, listener, 1)
              control.write_text(s)

          edge = Path('supabase/functions/admin-exams/index.ts')
          s = edge.read_text()
          if 'Draft exam cannot be deleted after an attempt exists' not in s:
              start = s.index("    if (action === 'delete') {")
              end = s.index("    return json({error:'Unknown action'},400)", start)
              block = '''    if (action === 'delete') {
            const examId=String(body.examId||''),confirmCode=String(body.confirmCode||'').trim()
            if (!examId) return json({error:'Exam ID is required'},400)
            const {data:exam,error:examError}=await admin.from('exams').select('id,status,is_published,result_published,exam_access(exam_code)').eq('id',examId).maybeSingle()
            if (examError) return json({error:examError.message},400)
            if (!exam) return json({error:'Exam not found'},404)
            const access=Array.isArray(exam.exam_access)?exam.exam_access[0]:exam.exam_access
            if (!access) return json({error:'Exam access record not found'},404)
            if (!confirmCode||confirmCode!==String(access.exam_code||'')) return json({error:'Type the exact Exam Code to delete this exam'},409)
            if (exam.is_published||exam.result_published) return json({error:'Published exams cannot be deleted'},409)
            if (String(exam.status||'').toLowerCase()!=='draft') return json({error:'Only draft exams can be deleted'},409)
            const {data:attemptRows,error:attemptError}=await admin.from('exam_attempts').select('id').eq('exam_id',examId)
            if (attemptError) return json({error:attemptError.message},400)
            const attemptIds=(attemptRows||[]).map((row:any)=>row.id)
            if (attemptIds.length) {
              const {count:resultCount,error:resultError}=await admin.from('exam_results').select('attempt_id',{count:'exact',head:true}).in('attempt_id',attemptIds)
              if (resultError) return json({error:resultError.message},400)
              if (Number(resultCount||0)>0) return json({error:'Draft exam cannot be deleted after a result exists'},409)
              return json({error:'Draft exam cannot be deleted after an attempt exists'},409)
            }
            const {data:deleted,error}=await admin.from('exams').delete().eq('id',examId).eq('status','draft').eq('is_published',false).eq('result_published',false).select('id').maybeSingle()
            if (error) return json({error:error.message},400)
            if (!deleted) return json({error:'Only draft exams can be deleted'},409)
            return json({ok:true,examId})
          }
          '''
              s = s[:start] + block + s[end:]
              edge.write_text(s)
          PY
      - name: Run focused GREEN contract
        run: node --test draft-exam-safe-delete.test.mjs
      - name: Commit implementation
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-exam-control-center.js supabase/functions/admin-exams/index.ts
          git commit -m "feat: safely delete draft exams"
          git push origin HEAD:fix/draft-exam-safe-delete

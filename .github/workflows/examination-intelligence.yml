name: Examination Intelligence Verification

on:
  push:
    branches:
      - feature/examination-intelligence-foundation
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run intelligence contracts
        run: >-
          node --test
          exam-intelligence-policy.test.mjs
          exam-intelligence-schema.test.mjs
          admin-exam-intelligence-contract.test.mjs
          question-bank-import-policy.test.mjs

      - name: Check browser JavaScript syntax
        run: node --check admin-exams.js

      - name: Parse admin exams Edge Function TypeScript
        run: >-
          npx -y esbuild@0.25.9
          supabase/functions/admin-exams/index.ts
          --bundle
          --platform=neutral
          --loader:.ts=ts
          --format=esm
          --outfile=/tmp/admin-exams.js
          --external:*

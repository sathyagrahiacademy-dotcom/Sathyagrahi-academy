<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEET Paper Viewer | Sathyagrahi Academy</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial,Helvetica,sans-serif;background:#eef3f8;color:#173a60}
.viewer{height:100%;display:grid;grid-template-rows:auto 1fr}
.viewer-head{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:10px 18px;background:#fff;border-bottom:1px solid #d8e3ed;box-shadow:0 3px 12px rgba(14,50,88,.06)}
.brand{display:flex;align-items:center;gap:12px}.brand img{height:42px;max-width:260px;object-fit:contain}.paper-title span{display:block;font-size:9px;letter-spacing:.12em;font-weight:900;color:#8193a5}.paper-title b{display:block;font-size:16px;color:#123f70;margin-top:3px}
.actions{display:flex;gap:8px;align-items:center}.actions a{display:inline-flex;align-items:center;min-height:38px;padding:0 12px;border-radius:7px;text-decoration:none;font-size:10px;font-weight:900}.back{background:#0b477f;color:#fff}.direct{border:1px solid #cdd9e4;color:#315b80;background:#fff}
.frame-wrap{padding:12px;background:#eaf0f6;min-height:0}.frame-wrap iframe{width:100%;height:100%;border:1px solid #cad6e1;border-radius:10px;background:#fff}
@media(max-width:680px){.viewer-head{align-items:flex-start;flex-direction:column}.brand img{height:35px}.actions{width:100%}.actions a{flex:1;justify-content:center}.frame-wrap{padding:6px}}
</style>
</head>
<body>
<div class="viewer">
<header class="viewer-head">
 <div class="brand">
   <img src="assets/header-brand.png" alt="Sathyagrahi Academy">
   <div class="paper-title"><span>NEET PREVIOUS PAPER</span><b id="title">Loading paper…</b></div>
 </div>
 <div class="actions">
   <a class="back" href="neet-papers.html">← PAPER LIBRARY</a>
   <a class="direct" id="directPdf" href="#" target="_blank">OPEN PDF ↗</a>
 </div>
</header>
<main class="frame-wrap"><iframe id="paperFrame" title="NEET Previous Paper"></iframe></main>
</div>
<script>
const p=new URLSearchParams(location.search);
const file=p.get('file')||'';
const year=p.get('year')||'';
const set=p.get('set')||'';
const safe=file.startsWith('papers/')&&!file.includes('..')&&file.toLowerCase().endsWith('.pdf');
document.getElementById('title').textContent=safe?`NEET ${year}${set&&set!=='Main Paper'?' · '+set:''}`:'Paper unavailable';
if(safe){
 document.getElementById('paperFrame').src=file+'#view=FitH';
 document.getElementById('directPdf').href=file;
}else{
 document.getElementById('paperFrame').srcdoc='<h2 style="font-family:Arial;padding:30px">Paper file is unavailable.</h2>';
 document.getElementById('directPdf').style.display='none';
}
</script>
</body>
</html>
